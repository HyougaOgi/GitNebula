name: Native builds and Git integration tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb xauth
      - run: python3 -m unittest discover -s tests -v
      - run: xvfb-run -a /usr/bin/python3 tests/gtk_smoke.py
      - run: sh Linux/package.sh --unsigned
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Mac
      - run: bash Mac/package.sh --unsigned
  windows:
    # Temporarily disabled. Set this to true to restore the existing Windows checks.
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Windows/GitNebula.csproj
      - run: dotnet run --project tests/windows/GitNebula.BackendTests.csproj
      - run: dotnet run --project tests/windows-ui/GitNebula.UiTests.csproj
      - run: ./tests/windows/Test-ContextMenu.ps1
      - run: ./Windows/Package.ps1
